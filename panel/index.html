<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 性价比面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel-body min-h-screen text-slate-900 dark:text-slate-100">
  <div class="panel-shell min-h-screen">
    <nav id="navbar" class="panel-nav sticky top-0 z-50">
      <div class="panel-nav__inner">
        <div class="filter-card">
          <div class="panel-toolbar">
            <label class="theme-switch" aria-label="切换深浅模式">
              <input type="checkbox" id="darkToggle" class="sr-only peer">
              <span class="theme-switch__track">
                <span class="theme-switch__thumb"></span>
              </span>
              <span class="theme-switch__label" id="darkLabel">深色</span>
            </label>
          </div>

          <div class="filter-bar text-sm">
            <div class="filter-group">
              <span class="filter-label">计费模式</span>
              <div class="segmented-control" id="quotaToggle">
                <button data-value="按量计费" class="quota-btn is-active">按量计费</button>
                <button data-value="按次计费" class="quota-btn">按次计费</button>
              </div>
            </div>

            <div class="filter-group relative" id="siteFilterWrap">
              <span class="filter-label">站点筛选</span>
              <button id="siteFilterBtn" class="filter-pill" type="button">
                <span id="siteFilterLabel">全部</span>
                <svg class="filter-pill__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div id="siteDropdown" class="filter-dropdown hidden absolute left-0 top-full mt-2 w-64 z-50 p-3">
                <input type="text" id="siteSearch" placeholder="搜索站点..." class="filter-search">
                <div class="filter-actions">
                  <button id="siteSelectAll" class="filter-action filter-action--primary" type="button">全选</button>
                  <button id="siteClearAll" class="filter-action" type="button">清空</button>
                </div>
                <div id="siteOptions" class="filter-options"></div>
              </div>
            </div>

            <div class="filter-group relative" id="modelFilterWrap">
              <span class="filter-label">模型筛选</span>
              <button id="modelFilterBtn" class="filter-pill" type="button">
                <span id="modelFilterLabel">全部</span>
                <svg class="filter-pill__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div id="modelDropdown" class="filter-dropdown hidden absolute left-0 top-full mt-2 w-72 z-50 p-3">
                <input type="text" id="modelSearch" placeholder="搜索模型..." class="filter-search">
                <div class="filter-actions">
                  <button id="modelSelectAll" class="filter-action filter-action--primary" type="button">全选</button>
                  <button id="modelClearAll" class="filter-action" type="button">清空</button>
                </div>
                <div id="modelOptions" class="filter-options"></div>
              </div>
            </div>

            <div class="filter-group">
              <span class="filter-label">金额筛选</span>
              <div class="amount-filter">
                <input type="number" id="maxAmount" placeholder="不限" class="amount-input">
                <button id="maxAmountBtn" class="amount-submit" type="button">确认</button>
              </div>
            </div>

            <div class="stats-chip">
              共 <span id="totalCount">0</span> 条
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="panel-main">
      <div id="loading" class="panel-loading">
        <div class="panel-loading__text">加载数据中...</div>
      </div>

      <section id="tableWrap" class="table-card hidden">
        <div class="table-scroll">
          <table class="panel-table text-left">
            <thead id="tableHead">
              <tr>
                <th class="sortable-col" data-key="value">1元相当 <span class="sort-arrow">▼</span></th>
                <th class="sortable-col" data-key="site">站点 <span class="sort-arrow"></span></th>
                <th class="sortable-col" data-key="plan">充值/套餐 <span class="sort-arrow"></span></th>
                <th class="sortable-col" data-key="amount">金额 <span class="sort-arrow"></span></th>
                <th class="sortable-col" data-key="model">模型 <span class="sort-arrow"></span></th>
                <th class="sortable-col" data-key="group">分组 <span class="sort-arrow"></span></th>
                <th class="sortable-col" data-key="quotaType">计费方式 <span class="sort-arrow"></span></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="panel-pagination sticky bottom-0">
          <div class="pagination-size">
            <span class="pagination-muted">每页</span>
            <select id="pageSize" class="page-size-select">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="pagination-muted">条</span>
          </div>
          <div class="pagination-controls">
            <button id="prevPage" class="page-btn" disabled>上一页</button>
            <span class="page-indicator"><span id="curPage">1</span> / <span id="totalPages">1</span></span>
            <button id="nextPage" class="page-btn" disabled>下一页</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
