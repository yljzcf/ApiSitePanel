<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 性价比面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

  <!-- 导航栏 -->
  <nav id="navbar" class="sticky top-0 z-50 bg-white dark:bg-gray-800 shadow-md">
    <!-- 第一行：标题 + 深浅模式 -->
    <div class="flex items-center justify-between px-4 py-2 border-b border-gray-200 dark:border-gray-700">
      <h1 class="text-lg font-bold">API 性价比面板</h1>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="darkToggle" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
        <span class="ml-2 text-sm" id="darkLabel">🌙</span>
      </label>
    </div>
    <!-- 第二行：筛选区 -->
    <div class="flex flex-wrap items-center gap-3 px-4 py-2 text-sm">
      <!-- 计费模式 -->
      <div class="flex items-center gap-1">
        <span class="text-gray-500 dark:text-gray-400 mr-1">计费:</span>
        <div class="inline-flex rounded-md shadow-sm" id="quotaToggle">
          <button data-value="按量计费" class="quota-btn px-3 py-1 rounded-l-md border border-gray-300 dark:border-gray-600 bg-indigo-500 text-white">按量计费</button>
          <button data-value="按次计费" class="quota-btn px-3 py-1 rounded-r-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300">按次计费</button>
        </div>
      </div>

      <!-- 站点筛选 -->
      <div class="relative" id="siteFilterWrap">
        <span class="text-gray-500 dark:text-gray-400 mr-1">站点:</span>
        <button id="siteFilterBtn" class="inline-flex items-center px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300">
          <span id="siteFilterLabel">全部</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="siteDropdown" class="hidden absolute left-0 top-full mt-1 w-64 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg z-50 p-2">
          <input type="text" id="siteSearch" placeholder="搜索站点..." class="w-full px-2 py-1 mb-2 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
          <div class="flex gap-2 mb-2">
            <button id="siteSelectAll" class="text-xs px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 rounded">全选</button>
            <button id="siteClearAll" class="text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 rounded">清空</button>
          </div>
          <div id="siteOptions" class="max-h-48 overflow-y-auto space-y-1"></div>
        </div>
      </div>

      <!-- 模型筛选 -->
      <div class="relative" id="modelFilterWrap">
        <span class="text-gray-500 dark:text-gray-400 mr-1">模型:</span>
        <button id="modelFilterBtn" class="inline-flex items-center px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300">
          <span id="modelFilterLabel">全部</span>
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="modelDropdown" class="hidden absolute left-0 top-full mt-1 w-72 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg z-50 p-2">
          <input type="text" id="modelSearch" placeholder="搜索模型..." class="w-full px-2 py-1 mb-2 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
          <div class="flex gap-2 mb-2">
            <button id="modelSelectAll" class="text-xs px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 rounded">全选</button>
            <button id="modelClearAll" class="text-xs px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400 rounded">清空</button>
          </div>
          <div id="modelOptions" class="max-h-48 overflow-y-auto space-y-1"></div>
        </div>
      </div>

      <!-- 消费金额筛选 -->
      <div class="flex items-center gap-1">
        <span class="text-gray-500 dark:text-gray-400 mr-1">金额≤:</span>
        <input type="number" id="maxAmount" placeholder="不限" class="w-20 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        <button id="maxAmountBtn" class="px-2 py-1 bg-indigo-500 text-white rounded-md text-sm hover:bg-indigo-600">确认</button>
      </div>

      <!-- 数据统计 -->
      <div class="ml-auto text-gray-400 dark:text-gray-500 text-xs">
        共 <span id="totalCount">0</span> 条
      </div>
    </div>
  </nav>

  <!-- 加载状态 -->
  <div id="loading" class="flex items-center justify-center py-20">
    <div class="text-gray-500 dark:text-gray-400">加载数据中...</div>
  </div>

  <!-- 表格容器 -->
  <div id="tableWrap" class="hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead id="tableHead" class="sticky bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs uppercase">
          <tr>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="value">1元相当 <span class="sort-arrow">▼</span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="site">站点 <span class="sort-arrow"></span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="plan">充值/套餐 <span class="sort-arrow"></span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="amount">金额 <span class="sort-arrow"></span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="model">模型 <span class="sort-arrow"></span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="group">分组 <span class="sort-arrow"></span></th>
            <th class="px-4 py-3 cursor-pointer select-none whitespace-nowrap" data-key="quotaType">计费方式 <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 sticky bottom-0">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500 dark:text-gray-400">每页</span>
        <select id="pageSize" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm">
          <option value="20" selected>20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="text-gray-500 dark:text-gray-400">条</span>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <button id="prevPage" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 disabled:opacity-40" disabled>上一页</button>
        <span class="text-gray-600 dark:text-gray-400"><span id="curPage">1</span> / <span id="totalPages">1</span></span>
        <button id="nextPage" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-300 disabled:opacity-40" disabled>下一页</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
